modules:
  rovo:agent:
    - key: drift-guard-agent
      name: "DriftGuard AI Auditor"
      description: "Autonomous Spec & Release Drift Auditor. Analyzes Confluence PRDs against Jira issues and Bitbucket PRs to detect drift, missing acceptance criteria, and release blockers."
      prompt: >
        You are DriftGuard AI, an autonomous Release Quality and Systems Architecture Auditor built for Atlassian Cloud.
        Your mission is to eliminate Spec-to-Ticket Drift and Release Blindspots across Confluence and Jira.
        When a user asks to audit an issue, a feature specification, or an upcoming release:
        1. Call 'audit-drift-action' to inspect Confluence requirements vs Jira ticket acceptance criteria.
        2. Categorize all detected discrepancies by severity (Critical, High, Medium, Low).
        3. If actionable drift is confirmed, offer or invoke 'reconcile-ticket-action' to sync criteria or create remediation sub-tasks.
        4. Calculate the overall Release Readiness Score using 'generate-release-score-action'.
        Always provide unambiguous, fact-based recommendations with concrete line diffs.
      actions:
        - audit-drift-action
        - reconcile-ticket-action
        - generate-release-score-action

  action:
    - key: audit-drift-action
      name: "Audit Spec Drift"
      description: "Compares Confluence specification text with Jira ticket acceptance criteria and returns detected discrepancies, severity ratings, and risk metrics."
      function: audit-drift-fn
      actionType: READ_ONLY

    - key: reconcile-ticket-action
      name: "Reconcile Ticket Criteria"
      description: "Updates a Jira issue's acceptance criteria or appends missing sub-tasks to align with the authoritative Confluence specification."
      function: reconcile-ticket-fn
      actionType: MUTATING

    - key: generate-release-score-action
      name: "Generate Release Readiness Score"
      description: "Computes a composite Release Readiness Score (0-100) based on drift count, test coverage alignment, and unresolved critical gaps."
      function: generate-release-score-fn
      actionType: READ_ONLY

  jira:issuePanel:
    - key: drift-guard-issue-panel
      title: "DriftGuard Spec Auditor"
      icon: "https://cdn-icons-png.flaticon.com/512/942/942748.png"
      resource: custom-ui-resource
      resolver:
        function: resolver-fn

  confluence:contentAction:
    - key: drift-guard-confluence-action
      text: "Audit Spec Drift (DriftGuard)"
      resource: custom-ui-resource
      resolver:
        function: resolver-fn

  function:
    - key: audit-drift-fn
      handler: src/engine/rovoActions.auditDriftHandler
    - key: reconcile-ticket-fn
      handler: src/engine/rovoActions.reconcileTicketHandler
    - key: generate-release-score-fn
      handler: src/engine/rovoActions.generateReleaseScoreHandler
    - key: resolver-fn
      handler: src/engine/rovoActions.resolverHandler

resources:
  - key: custom-ui-resource
    path: dist

permissions:
  scopes:
    - read:jira-work
    - write:jira-work
    - read:confluence-content.summary
    - read:confluence-props
    - storage:app

app:
  id: "ari:cloud:ecosystem::app/c7a10294-8451-4e89-82cf-driftguard001"
  runtime:
    name: nodejs22.x
